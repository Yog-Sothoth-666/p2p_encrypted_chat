syntax = "proto3";

message P2PMessage {
  // Define what kind of message this is
  enum MessageType {
    UNKNOWN = 0;
    RSA_PUB_KEY = 1;
    AES_KEY_EXCHANGE = 2;
    CHAT_MESSAGE = 3;
  }

  MessageType type = 1;      // Tells the FSM what state it should be in
  
  bytes payload = 2;         // The actual data (Public Key, Encrypted AES key, or Ciphertext)
  
  bytes nonce = 3;           // Required for AES-GCM
  bytes hmac_tag = 4;        // Required for integrity verification
}

// Local storage only - never sent over the wire
message ChatLogEntry {
  enum Direction {
    SENT = 0;
    RECEIVED = 1;
  }

  int64 timestamp = 1;              // Unix epoch milliseconds
  Direction direction = 2;           // Whether this was sent or received
  P2PMessage.MessageType message_type = 3;  // Type of message (RSA_PUB_KEY, AES_KEY_EXCHANGE, CHAT_MESSAGE)
  string plaintext_content = 4;     // Decrypted message content (for logs)
  bool hmac_verified = 5;           // Whether HMAC tag was valid
  bool signature_verified = 6;      // Whether RSA signature was valid
}

// Container for storing chat log entries (local storage only)
message ChatLog {
  repeated ChatLogEntry entries = 1;
}